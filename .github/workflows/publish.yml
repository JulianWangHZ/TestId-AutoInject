name: Publish

on:
  push:
    tags: ['v*']

# Trusted Publishing (OIDC): GitHub Actions authenticates to npm with a
# short-lived OIDC token — no long-lived NPM_TOKEN. Configure the trusted
# publisher on npmjs.com (package → Settings → Trusted Publishing) with this
# repo and workflow filename `publish.yml`. Provenance is generated automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build wasm + publish to npm (OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # Trusted publishing (OIDC) requires npm 11.5.1+.
      - run: npm install -g npm@latest
      - run: npm ci
      # No NODE_AUTH_TOKEN — npm authenticates via OIDC. prepublishOnly builds the wasm.
      - run: npm publish
