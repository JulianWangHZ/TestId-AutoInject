name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  babel:
    name: Babel engine (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  swc:
    name: SWC engine (id cross-check + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/swc-plugin
            packages/swc-plugin-16
      # 15.x engine (swc_core 35): id cross-check + wasm link.
      - name: cargo test (swc 15)
        working-directory: packages/swc-plugin
        run: cargo test
      - name: build wasm (swc 15)
        working-directory: packages/swc-plugin
        run: cargo build --release --target wasm32-wasip1
      # 16+ engine (swc_core 54): same, adapted to the newer AST API.
      - name: cargo test (swc 16)
        working-directory: packages/swc-plugin-16
        run: cargo test
      - name: build wasm (swc 16)
        working-directory: packages/swc-plugin-16
        run: cargo build --release --target wasm32-wasip1
