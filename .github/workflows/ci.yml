name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  babel:
    name: Babel engine (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  swc:
    name: SWC engine (id cross-check + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/swc-plugin
      # Native tests assert the Rust id logic matches the Babel engine.
      - name: cargo test
        working-directory: packages/swc-plugin
        run: cargo test
      # Ensure the wasm links (proves the --allow-undefined flag + version pins).
      - name: build wasm
        working-directory: packages/swc-plugin
        run: cargo build --release --target wasm32-wasip1
