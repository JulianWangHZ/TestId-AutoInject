[package]
name = "testid-autoinject-swc-16"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SWC plugin for testid-autoinject built against swc_core 54 (Next.js 16+). Sibling of ../swc-plugin (swc_core 35, Next 15.5.x)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swc_core = { version = "=54.0.0", features = ["ecma_plugin_transform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
