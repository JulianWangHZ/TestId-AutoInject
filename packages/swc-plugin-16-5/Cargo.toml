[package]
name = "testid-autoinject-swc-16-5"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SWC plugin for testid-autoinject built against swc_core 84.0.1 (Next.js 16.5). Shares source with ../swc-plugin-16."
publish = false

[lib]
crate-type = ["cdylib"]
path = "../swc-plugin-16/src/lib.rs"

[dependencies]
swc_core = { version = "=84.0.1", features = ["ecma_plugin_transform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
